<?xml version="1.0" encoding="UTF-8"?>
<!--
    O logotipo do MediFlow.

    As formas são as mesmas de
    `apps/mobile/android/app/src/main/res/drawable/ic_launcher_foreground.xml`,
    e a cor de fundo é a mesma de `values/colors.xml` — que por sua vez é
    `AppTheme.seedColor`. Três arquivos, um valor: nada no build os liga, então
    mudar a semente exige passar pelos três.

    O recorte circular reproduz o que o launcher do Android aplica: o canvas
    do ícone adaptativo tem 108 unidades, mas só as 72 centrais são
    garantidamente visíveis. O `viewBox` começa em 18,18 justamente por isso.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72"
     role="img" aria-label="MediFlow">
    <title>MediFlow</title>

    <circle cx="54" cy="54" r="36" fill="#3559C7" />

    <path fill="#FFFFFF" fill-rule="evenodd" d="
        M54,25 C38,25 25,38 25,54 C25,70 38,83 54,83 C70,83 83,70 83,54 C83,38 70,25 54,25 Z
        M49,37 L59,37 L59,49 L71,49 L71,59 L59,59 L59,71 L49,71 L49,59 L37,59 L37,49 L49,49 Z" />

    <path fill="#FFFFFF" d="
        M32,72 C38,78 45,81 54,81 C64,81 72,77 78,70 C74,80 65,87 54,87 C44,87 36,81 32,72 Z" />

    <path fill="#00B8A9" d="M28,55 C34,48 41,45 49,45 L49,51 C42,51 36,53 31,58 Z" />
    <path fill="#00B8A9" d="M59,57 C66,57 72,55 77,50 L80,55 C74,61 67,64 59,64 Z" />
</svg>
